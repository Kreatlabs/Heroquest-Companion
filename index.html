<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HeroQuest - Tácticas y Visión V9 (Reglas Oficiales)</title>
    <style>
        /* --- TEMA VISUAL HEROQUEST 2021 --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');

        :root { 
            --hq-bg: #1a1a1a; 
            --hq-parchment: #e8dcc5;
            --hq-parchment-dark: #d5c39a;
            --hq-red: #7c0a02; 
            --hq-red-hover: #a31105;
            --hq-gold: #c5a059;
            --hq-wood: #2c1e16;
            --hq-text: #2c1e16;
            --danger: #d63031; 
            --success: #27ae60; 
            --wall: #ffffff; 
        }
        
        body { 
            font-family: 'Lora', Georgia, serif; 
            background-color: var(--hq-bg); 
            background-image: radial-gradient(circle, #2a2a2a 0%, #111 100%);
            color: var(--hq-text); 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        h1, h3, h4 { 
            font-family: 'Cinzel', serif; 
            color: var(--hq-red); 
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
            margin-top: 0;
        }
        h1 { font-size: 1.8em; margin-bottom: 10px; color: var(--hq-gold); text-shadow: 2px 2px 4px #000; letter-spacing: 2px; }
        h3 { border-bottom: 2px solid var(--hq-gold); padding-bottom: 5px; font-size: 1.1em; }
        
        .app-layout { display: flex; gap: 15px; width: 100%; max-width: 1800px; justify-content: center; align-items: stretch; height: calc(100vh - 60px); }
        
        /* Paneles de Pergamino */
        .panel { 
            background-color: var(--hq-parchment); 
            background-image: linear-gradient(135deg, #f3e8d2 0%, #e8dcc5 50%, #d5c39a 100%);
            padding: 15px; 
            border-radius: 4px; 
            border: 4px solid var(--hq-wood);
            box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(100,70,30,0.2); 
            width: 330px; 
            flex-shrink: 0; 
            overflow-y: auto; 
            box-sizing: border-box; 
        }
        
        .center-column { 
            flex-grow: 1; 
            max-width: 1100px; 
            background: #0a0a0a; 
            border: 4px solid var(--hq-wood); 
            border-radius: 4px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.9); 
            overflow: auto; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 10px; 
        }
        
        .board-container { position: relative; user-select: none; flex-shrink: 0; transform-origin: top left; }
        canvas { position: absolute; top: 0; left: 0; touch-action: none; }
        #bgCanvas { z-index: 1; } #gridCanvas { z-index: 2; } #trapCanvas { z-index: 3; } #uiCanvas { z-index: 4; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 0.9em; color: var(--hq-wood); }
        
        input[type="range"], input[type="file"], select, button { width: 100%; margin-bottom: 5px; box-sizing: border-box; font-family: 'Lora', serif; }
        select { padding: 6px; background: #fff8e7; color: var(--hq-wood); border: 1px solid var(--hq-gold); border-radius: 2px; font-weight: bold; }
        
        /* Botones Clásicos */
        button { 
            background: linear-gradient(to bottom, #4a4a4a, #2c2c2c); 
            color: #fff; 
            border: 2px solid var(--hq-gold); 
            padding: 8px; 
            cursor: pointer; 
            border-radius: 3px; 
            font-weight: bold; 
            text-transform: uppercase;
            font-family: 'Cinzel', serif;
            font-size: 0.85em;
            letter-spacing: 1px;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { background: linear-gradient(to bottom, #5a5a5a, #3c3c3c); transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(1px); box-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        button:disabled { cursor: not-allowed; opacity: 0.5; filter: grayscale(100%); }
        
        button.active { 
            background: linear-gradient(to bottom, var(--hq-red-hover), var(--hq-red)); 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8); 
            border-color: #fff;
        }
        
        button.btn-success { background: linear-gradient(to bottom, #326034, #1b3d1c); }
        button.btn-success:hover:not(:disabled) { background: linear-gradient(to bottom, #3e7841, #245226); }
        button.btn-danger { background: linear-gradient(to bottom, #931b1b, #610d0d); }
        button.btn-danger:hover:not(:disabled) { background: linear-gradient(to bottom, #ad2020, #7a1111); }
        button.btn-warning { background: linear-gradient(to bottom, var(--hq-gold), #9e7f42); color: var(--hq-wood); }
        button.btn-warning:hover:not(:disabled) { background: linear-gradient(to bottom, #d4b470, #ad8f52); }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .full-width { grid-column: span 2; }
        
        /* Fichas de Entidades (Pergamino más oscuro) */
        .entity-card { 
            background: rgba(255,255,255,0.4); 
            border: 2px solid var(--hq-wood);
            border-left: 6px solid #0984e3; 
            margin-bottom: 8px; 
            padding: 8px; 
            border-radius: 2px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .entity-card:hover { background: rgba(255,255,255,0.7); }
        .entity-card.selected { 
            background: #fff8e7; 
            border-color: var(--hq-red); 
            box-shadow: 0 0 8px rgba(124,10,2,0.6); 
        }
        .entity-card.monster { border-left-color: var(--danger); }
        .entity-info { display: flex; flex-direction: column; pointer-events: none; flex-grow: 1; }
        .entity-name { font-weight: bold; font-size: 0.95em; font-family: 'Cinzel', serif; }
        .entity-hp { font-size: 0.8em; color: var(--hq-wood); margin-top: 3px; font-weight: bold; }
        .entity-actions { display: flex; gap: 4px; }
        .btn-small { padding: 4px; font-size: 0.7em; width: auto; margin: 0; min-width: 25px; }
        
        .graveyard { margin-top: 15px; }
        .dead-item { font-size: 0.9em; padding: 4px; border-bottom: 1px dashed var(--hq-wood); text-decoration: line-through; color: var(--hq-red); font-weight: bold; }

        .los-result { 
            background: rgba(255,255,255,0.5); 
            padding: 8px; margin-top: 5px; 
            border-radius: 2px; 
            border-left: 4px solid var(--success); 
            font-size: 0.85em; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--hq-gold);
        }
        .los-result.blocked { border-left-color: var(--danger); }
        
        /* Diario de Combate */
        #combatLog { 
            max-height: 150px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.05); 
            padding: 8px; 
            border: 1px inset var(--hq-wood);
            border-radius: 2px; 
            font-family: 'Lora', serif; 
            font-size: 0.85em; 
            color: var(--hq-wood); 
            margin-top: 10px; 
        }
        .log-entry { border-bottom: 1px dotted #ccc; padding-bottom: 4px; margin-bottom: 4px; }
        .log-hit { color: var(--hq-red); font-weight: bold; }
        .log-def { color: #0984e3; font-weight: bold; }
    </style>
</head>
<body>
    <h1>HEROQUEST - TÁCTICAS Y VISIÓN</h1>
    
    <div class="app-layout">
        <!-- PANEL IZQUIERDO -->
        <div class="panel">
            <div class="control-group">
                <h3>Lupa del Sabio</h3>
                <div class="btn-grid">
                    <button id="btnZoomOut">Alejar</button>
                    <button id="btnZoomIn">Acercar</button>
                    <button id="btnZoomReset" class="full-width">Vista Completa</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Pergaminos de Guardado</h3>
                <div class="btn-grid">
                    <button id="btnSave" class="btn-success">Guardar</button>
                    <button id="btnLoad" style="background: linear-gradient(to bottom, #1d6fa5, #124a6e);">Cargar</button>
                    <button id="btnClearAll" class="btn-danger full-width">Purgar Laberinto</button>
                </div>
            </div>

            <div class="control-group">
                <h3>Herramientas de Creador</h3>
                <div class="btn-grid">
                    <button class="tool-btn active" data-tool="hero">Héroe</button>
                    <button class="tool-btn" data-tool="monster">Monstruo</button>
                    <button class="tool-btn" data-tool="wall" id="btnToolWall">Muro</button>
                    <button class="tool-btn" data-tool="door" id="btnToolDoor">Puerta</button>
                    <button class="tool-btn" data-tool="furniture">Mobiliario</button>
                    <button class="tool-btn" data-tool="trap">Trampa</button>
                    <button class="tool-btn full-width" data-tool="eraser">Borrador Mágico</button>
                </div>
            </div>

            <div id="heroControls" class="control-group">
                <label>Convocar Héroe:</label>
                <select id="selHero">
                    <optgroup label="Juego Base">
                        <option value="Barbaro|3|2|8">Bárbaro (3 Atk, 2 Def, 8 PC)</option>
                        <option value="Enano|2|2|7">Enano (2 Atk, 2 Def, 7 PC)</option>
                        <option value="Elfo|2|2|6">Elfo (2 Atk, 2 Def, 6 PC)</option>
                        <option value="Mago|1|2|4">Mago (1 Atk, 2 Def, 4 PC)</option>
                    </optgroup>
                    <optgroup label="Héroes Adicionales">
                        <option value="Bardo|2|2|5">Bardo (2 Atk, 2 Def, 5 PC)</option>
                        <option value="Brujo|2|2|4">Brujo (Warlock) (2 Atk, 2 Def, 4 PC)</option>
                        <option value="Druida|1|2|6">La Druida (1 Atk, 2 Def, 6 PC)</option>
                        <option value="Caballero|2|2|7">El Caballero (2 Atk, 2 Def, 7 PC)</option>
                        <option value="Picaro|1|2|5">Heredero Pícaro (1 Atk, 2 Def, 5 PC)</option>
                        <option value="Monje|1|2|6">Monje Errante (1 Atk, 2 Def, 6 PC)</option>
                        <option value="Explorador|2|2|6">El Explorador (2 Atk, 2 Def, 6 PC)</option>
                        <option value="Berserker|3|2|8">El Berserker (3 Atk, 2 Def, 8 PC)</option>
                    </optgroup>
                </select>
            </div>

            <div id="monsterControls" class="control-group" style="display:none;">
                <label>Invocar Huestes de Zargon:</label>
                <select id="selMonster">
                    <optgroup label="Fuerzas del Terror">
                        <option value="Goblin|2|1|1">Goblin (2 Atk, 1 Def, 1 PC)</option>
                        <option value="Orco|3|2|1">Orco (3 Atk, 2 Def, 1 PC)</option>
                        <option value="Abominación|3|3|3">Abominación (3 Atk, 3 Def, 3 PC)</option>
                        <option value="Esqueleto|2|2|1">Esqueleto (2 Atk, 2 Def, 1 PC)</option>
                        <option value="Zombi|2|3|1">Zombi (2 Atk, 3 Def, 1 PC)</option>
                        <option value="Momia|3|4|2">Momia (3 Atk, 4 Def, 2 PC)</option>
                        <option value="Guerrero del Terror|4|4|3">G. Terror (4 Atk, 4 Def, 3 PC)</option>
                        <option value="Gárgola|4|5|3">Gárgola (4 Atk, 5 Def, 3 PC)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-group" id="doorControls" style="display:none;">
                <label>Orientación:</label>
                <button id="btnOrientation">↔️ Horizontal</button>
                <small style="display:block; margin-top:5px; font-style:italic;">(Doble Clic en Modo Juego para abrir/cerrar)</small>
                <div id="doorStateControl" style="margin-top:8px;">
                    <select id="selDoorState">
                        <option value="2">Puerta Cerrada</option>
                        <option value="3">Puerta Abierta</option>
                    </select>
                </div>
            </div>
            
            <div class="control-group" id="furnitureControls" style="display:none;">
                <label>Tipo de Mobiliario:</label>
                <select id="selFurniture">
                    <option value="mesa">Mesa (Permite Visión)</option>
                    <option value="cofre">Cofre (Permite Visión)</option>
                    <option value="armario">Armario (Bloquea Visión)</option>
                    <option value="roca">Roca/Derrumbe (Bloquea Visión)</option>
                </select>
            </div>

            <div class="control-group" id="trapControls" style="display:none;">
                <label>Trampas de Zargon (Invisibles):</label>
                <select id="selTrap">
                    <option value="foso">Foso (1 Daño al pisar, permanente)</option>
                    <option value="lanza">Lanza (Tira dado para esquivar, 1 uso)</option>
                    <option value="bloque">Bloque Movedizo (Bloquea permanentemente)</option>
                </select>
            </div>

            <div class="control-group" id="mapConfigGroup">
                <h3>Mapa Original</h3>
                <button id="btnToggleMapLock" class="btn-danger" style="font-size:1em; padding:10px;">🔒 Iniciar Aventura (Fijar Mapa)</button>
                
                <div id="mapAdjustments" style="margin-top: 10px;">
                    <label>Fondo de Tablero:</label>
                    <input type="file" id="imageUpload" accept="image/*">
                    <label>Opacidad:</label>
                    <input type="range" id="bgOpacity" min="0" max="1" step="0.05" value="0.8">
                    <label>Escala:</label>
                    <input type="range" id="bgScale" min="0.5" max="3" step="0.01" value="1.0">
                    <label>Posición X / Y:</label>
                    <input type="range" id="bgX" min="-800" max="800" step="1" value="0">
                    <input type="range" id="bgY" min="-800" max="800" step="1" value="0">
                </div>
            </div>
        </div>
        
        <!-- PANEL CENTRAL (TABLERO) -->
        <div class="center-column" id="centerColumn">
            <div class="board-container" id="boardContainer">
                <canvas id="bgCanvas"></canvas>
                <canvas id="gridCanvas"></canvas>
                <canvas id="trapCanvas"></canvas>
                <canvas id="uiCanvas"></canvas>
            </div>
        </div>

        <!-- PANEL DERECHO: COMBATE -->
        <div class="panel combat-panel">
            <div class="control-group">
                <button id="btnCalculate" class="btn-success" style="font-size: 1.1em; padding: 10px; margin-bottom: 5px;">👁️ Trazar Visión</button>
                <button id="btnCombat" class="btn-warning full-width" style="font-size: 1.1em; padding: 10px;" disabled>⚔️ Resolver Ataque</button>
            </div>
            
            <div class="control-group">
                <h3>Registro de Atacantes</h3>
                <div id="combatList">
                    <p style="color:var(--hq-wood); font-size:0.9em; text-align:center; font-style:italic;">Catacumbas vacías.</p>
                </div>
            </div>

            <div class="control-group">
                <h3>Resultados Visión</h3>
                <div id="losResults">
                    <p style="color:var(--hq-wood); font-size:0.9em; text-align:center;">Ninguna línea trazada.</p>
                </div>
            </div>

            <div class="control-group">
                <h3>Diario de Loretome</h3>
                <div id="combatLog"></div>
            </div>

            <div class="graveyard">
                <h4>Cementerio de Héroes y Monstruos</h4>
                <div id="graveyardList"></div>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTES Y ESTADO ---
        const cols = 26; const rows = 19; const cellSize = 35;
        const width = cols * cellSize; const height = rows * cellSize;

        const boardContainer = document.getElementById('boardContainer');
        boardContainer.style.width = width + 'px'; boardContainer.style.height = height + 'px';

        const canvases = {
            bg: document.getElementById('bgCanvas'),
            grid: document.getElementById('gridCanvas'),
            trap: document.getElementById('trapCanvas'),
            ui: document.getElementById('uiCanvas')
        };
        const ctxs = {};
        Object.keys(canvases).forEach(k => {
            canvases[k].width = width; canvases[k].height = height;
            ctxs[k] = canvases[k].getContext('2d');
        });

        let currentTool = 'hero'; let orientation = 'H';
        let bgImg = null; let isMapLocked = false; 
        let entityIdCounter = 0; let hoveredEntityId = null; 
        let selectedEntities = []; // Array of IDs [attacker, defender]
        let currentZoom = 1;
        
        // DRAG AND DROP GLOBALS
        let isDraggingTool = false; // For walls/erasers
        let draggedEntity = null;   // For moving heroes/monsters
        let dragStartCell = null;   // To distinguish click from drag
        
        let state = {
            entities: [], furniture: [], traps: [],
            hWalls: Array(rows + 1).fill().map(() => Array(cols).fill(0)), // 0:clear, 1:wall, 2:closed, 3:open
            vWalls: Array(rows).fill().map(() => Array(cols + 1).fill(0)),
            lines: [], dead: [], bgImgData: null
        };

        // --- SISTEMA DADOS HEROQUEST ---
        function rollDice(num) {
            let result = { skulls: 0, wShields: 0, bShields: 0, rolls: [] };
            for(let i=0; i<num; i++) {
                let r = Math.floor(Math.random() * 6) + 1;
                if(r <= 3) { result.skulls++; result.rolls.push('C'); }
                else if(r <= 5) { result.wShields++; result.rolls.push('W'); }
                else { result.bShields++; result.rolls.push('B'); }
            }
            return result;
        }

        function addLog(msg) {
            const log = document.getElementById('combatLog');
            log.innerHTML = `<div class="log-entry">${msg}</div>` + log.innerHTML;
        }

        // --- ZOOM ---
        function applyZoom() {
            boardContainer.style.transform = `scale(${currentZoom})`;
            boardContainer.style.marginBottom = (height * (currentZoom - 1)) + 'px';
            boardContainer.style.marginRight = (width * (currentZoom - 1)) + 'px';
        }
        document.getElementById('btnZoomIn').addEventListener('click', () => { currentZoom = Math.min(currentZoom + 0.2, 3); applyZoom(); });
        document.getElementById('btnZoomOut').addEventListener('click', () => { currentZoom = Math.max(currentZoom - 0.2, 0.4); applyZoom(); });
        document.getElementById('btnZoomReset').addEventListener('click', () => { currentZoom = 1; applyZoom(); });

        // --- INTERFAZ EVENTOS ---
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(e.target.disabled) return;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTool = e.target.dataset.tool;
                
                ['door', 'furniture', 'hero', 'monster', 'trap'].forEach(t => {
                    const el = document.getElementById(t + 'Controls');
                    if(el) el.style.display = (currentTool === t || (t==='door' && ['wall', 'eraser'].includes(currentTool))) ? 'block' : 'none';
                });
                
                selectedEntities = []; updateCombatUI();
            });
        });

        document.getElementById('btnOrientation').addEventListener('click', (e) => {
            orientation = orientation === 'H' ? 'V' : 'H';
            e.target.innerText = orientation === 'H' ? '↔️ Horizontal' : '↕️ Vertical';
        });

        document.getElementById('btnToggleMapLock').addEventListener('click', (e) => {
            isMapLocked = !isMapLocked;
            const adj = document.getElementById('mapAdjustments');
            const wallBtn = document.getElementById('btnToolWall');
            const trapBtn = document.querySelector('[data-tool="trap"]');
            const eraserBtn = document.querySelector('[data-tool="eraser"]');
            
            if (isMapLocked) {
                adj.style.display = 'none';
                e.target.innerText = '🔓 Detener Partida (Modo Edición)'; 
                e.target.className = 'btn-success';
                wallBtn.disabled = true; trapBtn.disabled = true; eraserBtn.disabled = true;
                if (['wall', 'trap', 'eraser'].includes(currentTool)) document.querySelector('[data-tool="hero"]').click();
                addLog("<b>Partida Iniciada.</b> Puedes arrastrar las miniaturas para moverlas.");
            } else {
                adj.style.display = 'block';
                e.target.innerText = '🔒 Iniciar Aventura (Fijar Mapa)'; 
                e.target.className = 'btn-danger';
                wallBtn.disabled = false; trapBtn.disabled = false; eraserBtn.disabled = false;
            }
            drawAll(); 
        });

        ['bgOpacity', 'bgScale', 'bgX', 'bgY'].forEach(id => { document.getElementById(id).addEventListener('input', drawAll); });

        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const r = new FileReader();
                r.onload = (ev) => {
                    bgImg = new Image(); bgImg.onload = () => drawAll();
                    bgImg.src = ev.target.result; state.bgImgData = ev.target.result;
                };
                r.readAsDataURL(file);
            }
        });

        // --- PERSISTENCIA ---
        document.getElementById('btnSave').addEventListener('click', () => {
            try {
                localStorage.setItem('hq_save_v9', JSON.stringify({
                    state: state, idCounter: entityIdCounter,
                    conf: { o: document.getElementById('bgOpacity').value, s: document.getElementById('bgScale').value, x: document.getElementById('bgX').value, y: document.getElementById('bgY').value }
                }));
                addLog("<i>El sabio Mentor ha guardado la partida.</i>");
            } catch (err) {
                const s2 = {...state}; s2.bgImgData = null;
                localStorage.setItem('hq_save_v9', JSON.stringify({state: s2, idCounter: entityIdCounter}));
                addLog("Guardado sin imagen (Límite peso).");
            }
        });

        document.getElementById('btnLoad').addEventListener('click', () => {
            const data = JSON.parse(localStorage.getItem('hq_save_v9'));
            if (data) {
                state = data.state; entityIdCounter = data.idCounter;
                if (data.conf) {
                    document.getElementById('bgOpacity').value = data.conf.o; document.getElementById('bgScale').value = data.conf.s;
                    document.getElementById('bgX').value = data.conf.x; document.getElementById('bgY').value = data.conf.y;
                }
                if (state.bgImgData) { bgImg = new Image(); bgImg.onload = () => drawAll(); bgImg.src = state.bgImgData; }
                else bgImg = null;
                drawAll(); updateCombatUI(); addLog("<i>Partida Restaurada.</i>");
            }
        });

        document.getElementById('btnClearAll').addEventListener('click', () => {
            if(confirm('¿Borrar TODO el laberinto?')) {
                state = { entities: [], furniture: [], traps: [], lines: [], dead: [], bgImgData: null, hWalls: Array(rows + 1).fill().map(() => Array(cols).fill(0)), vWalls: Array(rows).fill().map(() => Array(cols + 1).fill(0)) };
                bgImg = null; entityIdCounter = 0; document.getElementById('combatLog').innerHTML = '';
                drawAll(); updateCombatUI();
            }
        });

        // --- RENDERIZADO ---
        function drawBackground() {
            ctxs.bg.clearRect(0, 0, width, height); ctxs.bg.fillStyle = '#0a0a0a'; ctxs.bg.fillRect(0, 0, width, height);
            if (bgImg) {
                ctxs.bg.globalAlpha = parseFloat(document.getElementById('bgOpacity').value);
                const s = parseFloat(document.getElementById('bgScale').value);
                ctxs.bg.drawImage(bgImg, parseFloat(document.getElementById('bgX').value), parseFloat(document.getElementById('bgY').value), bgImg.width * s, bgImg.height * s);
                ctxs.bg.globalAlpha = 1.0;
            }
        }

        function drawGrid() {
            ctxs.grid.clearRect(0, 0, width, height);
            ctxs.grid.strokeStyle = 'rgba(255, 255, 255, 0.1)'; ctxs.grid.lineWidth = 1;
            for (let i = 0; i <= cols; i++) { ctxs.grid.beginPath(); ctxs.grid.moveTo(i * cellSize, 0); ctxs.grid.lineTo(i * cellSize, height); ctxs.grid.stroke(); }
            for (let i = 0; i <= rows; i++) { ctxs.grid.beginPath(); ctxs.grid.moveTo(0, i * cellSize); ctxs.grid.lineTo(width, i * cellSize); ctxs.grid.stroke(); }

            const drawSegment = (x0, y0, x1, y1, type) => {
                if (type === 1) { 
                    ctxs.grid.beginPath(); ctxs.grid.moveTo(x0, y0); ctxs.grid.lineTo(x1, y1);
                    ctxs.grid.lineWidth = 6; ctxs.grid.strokeStyle = '#ffffff'; ctxs.grid.stroke();
                } else if (type === 2 || type === 3) { 
                    ctxs.grid.beginPath(); ctxs.grid.moveTo(x0, y0); ctxs.grid.lineTo(x1, y1);
                    ctxs.grid.lineWidth = 12; ctxs.grid.strokeStyle = type === 2 ? '#b35a1f' : '#27ae60'; ctxs.grid.stroke();
                    ctxs.grid.beginPath(); ctxs.grid.moveTo(x0, y0); ctxs.grid.lineTo(x1, y1);
                    ctxs.grid.lineWidth = 4; ctxs.grid.strokeStyle = '#ffffff'; ctxs.grid.stroke();
                }
            };

            for (let y = 0; y <= rows; y++) for (let x = 0; x < cols; x++) if (state.hWalls[y][x] > 0) drawSegment(x*cellSize, y*cellSize, (x+1)*cellSize, y*cellSize, state.hWalls[y][x]);
            for (let y = 0; y < rows; y++) for (let x = 0; x <= cols; x++) if (state.vWalls[y][x] > 0) drawSegment(x*cellSize, y*cellSize, x*cellSize, (y+1)*cellSize, state.vWalls[y][x]);
        }

        function drawTraps() {
            ctxs.trap.clearRect(0, 0, width, height);
            state.traps.forEach(t => {
                if (!isMapLocked || t.revealed) {
                    ctxs.trap.fillStyle = t.revealed ? 'rgba(124, 10, 2, 0.6)' : 'rgba(197, 160, 89, 0.4)'; // Red if revealed, Gold if hidden (editor)
                    ctxs.trap.fillRect(t.x * cellSize + 2, t.y * cellSize + 2, cellSize - 4, cellSize - 4);
                    
                    ctxs.trap.fillStyle = '#fff'; ctxs.trap.font = 'bold 11px Cinzel, serif'; ctxs.trap.textAlign = 'center';
                    let label = t.type === 'foso' ? 'FOS' : t.type === 'lanza' ? 'LAN' : 'BLO';
                    ctxs.trap.fillText(label, t.x * cellSize + cellSize/2, t.y * cellSize + cellSize/2 + 5);
                }
            });
        }

        function drawEntities() {
            ctxs.ui.clearRect(0, 0, width, height);

            state.furniture.forEach(f => {
                ctxs.ui.fillStyle = '#8e44ad';
                if (f.type === 'mesa') ctxs.ui.fillStyle = '#5c4033';
                if (f.type === 'armario') ctxs.ui.fillStyle = '#2c1e16';
                if (f.type === 'cofre') ctxs.ui.fillStyle = '#c5a059';
                if (f.type === 'roca') ctxs.ui.fillStyle = '#4a4a4a';
                ctxs.ui.fillRect(f.x * cellSize + 2, f.y * cellSize + 2, cellSize - 4, cellSize - 4);
                ctxs.ui.fillStyle = '#ffffff'; ctxs.ui.font = 'bold 11px Cinzel, serif'; ctxs.ui.textAlign = 'center';
                ctxs.ui.fillText(f.type.substring(0, 2).toUpperCase(), f.x * cellSize + cellSize/2, f.y * cellSize + cellSize/2 + 5);
            });

            state.entities.forEach(e => {
                const cx = e.x * cellSize + cellSize/2; const cy = e.y * cellSize + cellSize/2;
                
                ctxs.ui.beginPath(); ctxs.ui.arc(cx, cy, cellSize/2 - 4, 0, Math.PI * 2);
                ctxs.ui.fillStyle = e.type === 'hero' ? '#0984e3' : '#a31105'; ctxs.ui.fill();
                
                if (selectedEntities.includes(e.id)) { ctxs.ui.strokeStyle = '#c5a059'; ctxs.ui.lineWidth = 4; } 
                else if (e.id === hoveredEntityId) { ctxs.ui.strokeStyle = '#fff'; ctxs.ui.lineWidth = 3; }
                else { ctxs.ui.strokeStyle = '#2c1e16'; ctxs.ui.lineWidth = 2; }
                ctxs.ui.stroke();
                
                ctxs.ui.fillStyle = '#ffffff'; ctxs.ui.font = 'bold 11px Cinzel, serif'; ctxs.ui.textAlign = 'center';
                ctxs.ui.fillText(e.name.substring(0, 3).toUpperCase(), cx, cy - 2);
                ctxs.ui.font = 'bold 12px Lora, serif'; ctxs.ui.fillText(e.hp, cx, cy + 11);
            });

            // Draw Lines of Sight
            state.lines.forEach(l => {
                ctxs.ui.beginPath(); ctxs.ui.moveTo(l.x1, l.y1); ctxs.ui.lineTo(l.x2, l.y2);
                ctxs.ui.strokeStyle = l.clear ? '#27ae60' : '#7c0a02';
                ctxs.ui.lineWidth = 3; ctxs.ui.setLineDash([5, 5]); ctxs.ui.stroke(); ctxs.ui.setLineDash([]);
                if (!l.clear && l.hit) {
                    ctxs.ui.beginPath(); ctxs.ui.arc(l.hit.x, l.hit.y, 6, 0, Math.PI*2);
                    ctxs.ui.fillStyle = '#c5a059'; ctxs.ui.fill(); ctxs.ui.stroke();
                }
            });
        }

        function drawAll() { drawBackground(); drawGrid(); drawTraps(); drawEntities(); }

        // --- INTERACCIÓN TABLERO Y DRAG & DROP ---
        function checkTrapActivation(e) {
            if (!isMapLocked) return; 
            
            const trapIdx = state.traps.findIndex(t => t.x === e.x && t.y === e.y && !t.revealed);
            if (trapIdx > -1) {
                const t = state.traps[trapIdx];
                t.revealed = true;
                addLog(`⚠️ <b>${e.name} ha activado una trampa: ${t.type.toUpperCase()}</b>`);
                
                if (t.type === 'foso') {
                    e.inPit = true; e.hp--;
                    addLog(`<span class="log-hit">Cae al foso: 1 Herida. (PC: ${e.hp})</span>`);
                    if(e.hp <= 0) window.killEntity(e.id);
                } else if (t.type === 'lanza') {
                    const roll = rollDice(1);
                    if (roll.skulls > 0) {
                        e.hp--; addLog(`<span class="log-hit">¡La lanza impacta! (Calavera). 1 Herida.</span>`);
                        if(e.hp <= 0) window.killEntity(e.id);
                    } else { addLog(`<span class="log-def">¡Reflejos rápidos! Esquivó la lanza.</span>`); }
                    state.traps.splice(trapIdx, 1); 
                } else if (t.type === 'bloque') {
                    addLog(`¡Derrumbe! El paso queda bloqueado.`);
                    state.furniture.push({x: t.x, y: t.y, type: 'roca'});
                }
                drawAll(); updateCombatUI();
            }
        }

        canvases.ui.addEventListener('mousedown', (e) => {
            const rect = canvases.ui.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / currentZoom; const mouseY = (e.clientY - rect.top) / currentZoom;
            const cellX = Math.floor(mouseX / cellSize); const cellY = Math.floor(mouseY / cellSize);
            if (cellX < 0 || cellX >= cols || cellY < 0 || cellY >= rows) return;
            
            dragStartCell = { x: cellX, y: cellY };

            if (isMapLocked) {
                const ent = state.entities.find(en => en.x === cellX && en.y === cellY);
                if (ent) {
                    draggedEntity = ent;
                    state.lines = []; // LIMPIEZA AUTOMÁTICA DE VISIÓN AL MOVERSE
                    drawAll();
                }
            } else {
                isDraggingTool = true;
                handleEditorAction(cellX, cellY, mouseX, mouseY, false);
            }
        });

        canvases.ui.addEventListener('mousemove', (e) => {
            const rect = canvases.ui.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / currentZoom; const mouseY = (e.clientY - rect.top) / currentZoom;
            const cellX = Math.floor(mouseX / cellSize); const cellY = Math.floor(mouseY / cellSize);
            if (cellX < 0 || cellX >= cols || cellY < 0 || cellY >= rows) return;

            if (isMapLocked && draggedEntity) {
                draggedEntity.x = cellX; draggedEntity.y = cellY;
                drawAll();
            } else if (!isMapLocked && isDraggingTool) {
                handleEditorAction(cellX, cellY, mouseX, mouseY, true);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (isMapLocked && draggedEntity) {
                const rect = canvases.ui.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) / currentZoom; const mouseY = (e.clientY - rect.top) / currentZoom;
                const cellX = Math.floor(mouseX / cellSize); const cellY = Math.floor(mouseY / cellSize);
                
                const occupied = state.entities.some(en => en !== draggedEntity && en.x === cellX && en.y === cellY);
                const isWallBlocked = state.furniture.some(f => (f.type === 'armario' || f.type === 'roca') && f.x === cellX && f.y === cellY);
                
                if (occupied || isWallBlocked) {
                    draggedEntity.x = dragStartCell.x; draggedEntity.y = dragStartCell.y;
                } else {
                    draggedEntity.x = cellX; draggedEntity.y = cellY;
                    checkTrapActivation(draggedEntity);
                }
                
                if (dragStartCell.x === cellX && dragStartCell.y === cellY) toggleSelection(draggedEntity.id);
                
                draggedEntity = null; drawAll();
            }
            isDraggingTool = false;
        });

        // Doble Clic para Puertas (Toggle)
        canvases.ui.addEventListener('dblclick', (e) => {
            if(!isMapLocked) return;
            const rect = canvases.ui.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / currentZoom; const mouseY = (e.clientY - rect.top) / currentZoom;
            const cellX = Math.floor(mouseX / cellSize); const cellY = Math.floor(mouseY / cellSize);
            
            const edgeYH = Math.round(mouseY / cellSize);
            if (edgeYH >= 0 && edgeYH <= rows && state.hWalls[edgeYH][cellX] >= 2) {
                state.hWalls[edgeYH][cellX] = state.hWalls[edgeYH][cellX] === 2 ? 3 : 2; drawAll(); return;
            }
            const edgeXV = Math.round(mouseX / cellSize);
            if (edgeXV >= 0 && edgeXV <= cols && state.vWalls[cellY][edgeXV] >= 2) {
                state.vWalls[cellY][edgeXV] = state.vWalls[cellY][edgeXV] === 2 ? 3 : 2; drawAll();
            }
        });

        // Lógica de Pintado para Modo Edición
        function handleEditorAction(cellX, cellY, mouseX, mouseY, isDragEvent) {
            if (currentTool === 'hero' || currentTool === 'monster') {
                if (isDragEvent) return; 
                const sel = document.getElementById(currentTool === 'hero' ? 'selHero' : 'selMonster').value;
                const [name, atk, def, hp] = sel.split('|');
                
                state.entities = state.entities.filter(e => !(e.x === cellX && e.y === cellY));
                state.entities.push({ id: ++entityIdCounter, x: cellX, y: cellY, type: currentTool, name: name, atk: parseInt(atk), def: parseInt(def), hp: parseInt(hp), maxHp: parseInt(hp), inPit: false });
            } 
            else if (currentTool === 'furniture') {
                if (isDragEvent) return;
                const type = document.getElementById('selFurniture').value;
                state.furniture = state.furniture.filter(f => !(f.x === cellX && f.y === cellY));
                state.furniture.push({x: cellX, y: cellY, type});
            }
            else if (currentTool === 'trap') {
                if (isDragEvent) return;
                const type = document.getElementById('selTrap').value;
                state.traps = state.traps.filter(t => !(t.x === cellX && t.y === cellY));
                state.traps.push({x: cellX, y: cellY, type: type, revealed: false});
            }
            else if (currentTool === 'wall' || currentTool === 'door') {
                const isWall = currentTool === 'wall';
                if (!isWall && isDragEvent) return; 
                
                const val = isWall ? 1 : parseInt(document.getElementById('selDoorState').value);
                if (orientation === 'H') {
                    const edgeY = Math.round(mouseY / cellSize);
                    if (edgeY >= 0 && edgeY <= rows) {
                        if (isWall && state.hWalls[edgeY][cellX] >= 2) return; 
                        state.hWalls[edgeY][cellX] = val;
                    }
                } else {
                    const edgeX = Math.round(mouseX / cellSize);
                    if (edgeX >= 0 && edgeX <= cols) {
                        if (isWall && state.vWalls[cellY][edgeX] >= 2) return;
                        state.vWalls[cellY][edgeX] = val;
                    }
                }
            } 
            else if (currentTool === 'eraser') {
                state.entities = state.entities.filter(e => !(e.x === cellX && e.y === cellY));
                state.furniture = state.furniture.filter(f => !(f.x === cellX && f.y === cellY));
                state.traps = state.traps.filter(t => !(t.x === cellX && t.y === cellY));
                
                if (orientation === 'H') {
                    const edgeY = Math.round(mouseY / cellSize);
                    if (edgeY >= 0 && edgeY <= rows) state.hWalls[edgeY][cellX] = 0;
                } else {
                    const edgeX = Math.round(mouseX / cellSize);
                    if (edgeX >= 0 && edgeX <= cols) state.vWalls[cellY][edgeX] = 0;
                }
            }
            drawAll(); updateCombatUI();
        }

        // --- SISTEMA COMBATE Y SELECCIÓN ---
        window.setHover = function(id) { hoveredEntityId = id; drawAll(); };
        window.clearHover = function() { hoveredEntityId = null; drawAll(); };

        function toggleSelection(id) {
            const idx = selectedEntities.indexOf(id);
            if (idx > -1) selectedEntities.splice(idx, 1);
            else if (selectedEntities.length < 2) selectedEntities.push(id);
            else { selectedEntities.shift(); selectedEntities.push(id); }
            
            document.getElementById('btnCombat').disabled = selectedEntities.length !== 2;
            updateCombatUI(); drawAll();
        }

        window.damageEntity = function(id, amount=1) {
            const entity = state.entities.find(e => e.id === id);
            if (entity) {
                entity.hp -= amount;
                addLog(`Daño a ${entity.name} (-${amount} PC)`);
                if (entity.hp <= 0) window.killEntity(id);
                drawAll(); updateCombatUI();
            }
        };

        window.killEntity = function(id) {
            const idx = state.entities.findIndex(e => e.id === id);
            if (idx > -1) {
                const name = state.entities[idx].name;
                state.dead.push(name);
                state.entities.splice(idx, 1);
                addLog(`💀 <b>${name} ha caído en combate!</b>`);
                selectedEntities = selectedEntities.filter(sid => sid !== id);
                document.getElementById('btnCombat').disabled = selectedEntities.length !== 2;
                state.lines = []; hoveredEntityId = null;
                drawAll(); updateCombatUI();
            }
        };

        function updateCombatUI() {
            const list = document.getElementById('combatList'); list.innerHTML = '';
            if (state.entities.length === 0) list.innerHTML = '<p style="color:var(--hq-wood); font-size:0.9em; text-align:center; font-style:italic;">Catacumbas vacías.</p>';
            else {
                state.entities.forEach(e => {
                    const selClass = selectedEntities.includes(e.id) ? 'selected' : '';
                    list.innerHTML += `
                        <div class="entity-card ${e.type} ${selClass}" onmouseenter="setHover(${e.id})" onmouseleave="clearHover()" onclick="toggleSelection(${e.id})">
                            <div class="entity-info">
                                <span class="entity-name">${e.name} (Atk: ${e.atk}, Def: ${e.def})</span>
                                <span class="entity-hp">P. Corp: ${e.hp} / ${e.maxHp} ${e.inPit ? '<span style="color:var(--danger)">[En Foso]</span>' : ''}</span>
                            </div>
                            <div class="entity-actions">
                                <button class="btn-small btn-danger" onclick="event.stopPropagation(); damageEntity(${e.id}, 1)" title="Restar Vida">-1</button>
                                <button class="btn-small" style="background:#555;" onclick="event.stopPropagation(); killEntity(${e.id})" title="Eliminar">X</button>
                            </div>
                        </div>`;
                });
            }
            document.getElementById('graveyardList').innerHTML = state.dead.map(d => `<div class="dead-item">💀 ${d}</div>`).join('');
        }

        // --- MOTOR FÍSICO Y VISIÓN (GEOMETRÍA EXACTA) ---
        document.getElementById('btnCalculate').addEventListener('click', () => {
            state.lines = [];
            let attackers = []; let defenders = [];
            
            if (selectedEntities.length === 1) {
                const ent = state.entities.find(e => e.id === selectedEntities[0]);
                attackers = [ent];
                defenders = state.entities.filter(e => e.id !== ent.id);
            } else if (selectedEntities.length === 2) {
                attackers = [state.entities.find(e => e.id === selectedEntities[0])];
                defenders = [state.entities.find(e => e.id === selectedEntities[1])];
            } else {
                attackers = state.entities.filter(e => e.type === 'hero');
                defenders = state.entities.filter(e => e.type === 'monster');
                
                // MEJORA: Si no hay monstruos en el tablero, trazamos visión entre Héroes para comprobar rangos.
                if (attackers.length === 0 || defenders.length === 0) {
                    attackers = state.entities;
                    defenders = state.entities;
                }
            }

            const losContainer = document.getElementById('losResults'); losContainer.innerHTML = '';
            
            attackers.forEach(atk => {
                defenders.forEach(def => {
                    if (atk.id === def.id) return; // No trazar visión hacia sí mismo
                    
                    const res = checkLoS(atk, def);
                    state.lines.push({ x1: res.hx, y1: res.hy, x2: res.mx, y2: res.my, clear: res.clear, hit: res.hit });
                    
                    const status = res.clear ? '✅ Visible' : '❌ Bloqueado';
                    const cssClass = res.clear ? '' : 'blocked';
                    losContainer.innerHTML += `
                        <div class="los-result ${cssClass}">
                            <span><b>${atk.name}</b> ve a <b>${def.name}</b><br><small>${status}</small></span>
                            ${res.clear ? `<button class="btn-small btn-warning" onclick="toggleSelection(${atk.id}); toggleSelection(${def.id});">Apuntar</button>` : ''}
                        </div>`;
                });
            });
            if(state.lines.length === 0) losContainer.innerHTML = '<p style="color:var(--hq-wood); font-size:0.9em; text-align:center;">Nada a la vista.</p>';
            drawAll();
        });

        document.getElementById('btnCombat').addEventListener('click', () => {
            if(selectedEntities.length !== 2) return;
            const attacker = state.entities.find(e => e.id === selectedEntities[0]);
            const defender = state.entities.find(e => e.id === selectedEntities[1]);
            if(!attacker || !defender) return;
            
            addLog(`<br><b>[COMBATE] ${attacker.name} Ataca a ${defender.name}</b>`);
            
            const losRes = checkLoS(attacker, defender);
            const dx = Math.abs(attacker.x - defender.x); const dy = Math.abs(attacker.y - defender.y);
            
            if(!losRes.clear && (dx>1 || dy>1)) {
                addLog(`<span class="log-hit">Ataque fallido: No hay línea de visión.</span>`); return;
            }
            
            let atkDice = attacker.atk;
            if(attacker.inPit) atkDice = Math.max(1, atkDice - 1);
            
            const atkRoll = rollDice(atkDice);
            addLog(`${attacker.name} tira ${atkDice} dados. Obtiene: <span class="log-hit">${atkRoll.skulls} Calaveras</span>.`);
            
            if(atkRoll.skulls === 0) { addLog("El ataque falló estrepitosamente."); return; }
            
            let defDice = defender.def;
            if(defender.inPit) defDice = Math.max(1, defDice - 1);
            
            const defRoll = rollDice(defDice);
            let blocks = defender.type === 'hero' ? defRoll.wShields : defRoll.bShields;
            let blockStr = defender.type === 'hero' ? "Escudos Blancos" : "Escudos Negros";
            
            addLog(`${defender.name} defiende con ${defDice} dados. Obtiene: <span class="log-def">${blocks} ${blockStr}</span>.`);
            
            const damage = Math.max(0, atkRoll.skulls - blocks);
            if(damage > 0) {
                defender.hp -= damage;
                addLog(`<span class="log-hit">=> ${defender.name} recibe ${damage} Heridas! (Queda ${defender.hp} PC)</span>`);
                if(defender.hp <= 0) window.killEntity(defender.id);
            } else {
                addLog(`<span class="log-def">=> ${defender.name} bloqueó todo el daño con su armadura.</span>`);
            }
            
            selectedEntities = []; document.getElementById('btnCombat').disabled = true;
            drawAll(); updateCombatUI();
        });

        // NUEVO MOTOR DE LÍNEA DE VISIÓN BASADO EN SEGMENTOS GEOMÉTRICOS (REGLAS ORIGINALES HQ)
        function checkLoS(ent1, ent2) {
            const p1 = { x: ent1.x * cellSize + cellSize/2, y: ent1.y * cellSize + cellSize/2 };
            const p2 = { x: ent2.x * cellSize + cellSize/2, y: ent2.y * cellSize + cellSize/2 };

            let hitPoint = null;
            let minT = 1;

            // Función de intersección estricta: Ignora los toques perfectos en esquinas
            function checkIntersect(c, d) {
                const v1x = p2.x - p1.x; const v1y = p2.y - p1.y;
                const v2x = d.x - c.x; const v2y = d.y - c.y;
                
                const det = v1x * v2y - v1y * v2x;
                if (det === 0) return; // Líneas paralelas
                
                const dx = c.x - p1.x; const dy = c.y - p1.y;
                
                const t = (dy * v2x - dx * v2y) / det;
                const u = (dy * v1x - dx * v1y) / det;
                
                // > 0.001 y < 0.999 permite que la visión pase EXACTAMENTE por la esquina sin ser bloqueada
                if (t > 0.001 && t < 0.999 && u > 0.001 && u < 0.999) {
                    if (t < minT) {
                        minT = t;
                        hitPoint = { x: p1.x + t * v1x, y: p1.y + t * v1y };
                    }
                }
            }

            // Comprobar Muros Horizontales
            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (state.hWalls[y][x] === 1 || state.hWalls[y][x] === 2) { // 1=Muro, 2=Puerta Cerrada
                        checkIntersect({x: x * cellSize, y: y * cellSize}, {x: (x+1) * cellSize, y: y * cellSize});
                    }
                }
            }
            // Comprobar Muros Verticales
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    if (state.vWalls[y][x] === 1 || state.vWalls[y][x] === 2) {
                        checkIntersect({x: x * cellSize, y: y * cellSize}, {x: x * cellSize, y: (y+1) * cellSize});
                    }
                }
            }
            
            // Comprobar Entidades y Muebles bloqueantes
            const blockers = [];
            state.entities.forEach(e => { if (e.id !== ent1.id && e.id !== ent2.id) blockers.push(e); });
            state.furniture.forEach(f => { if (f.type === 'armario' || f.type === 'roca') blockers.push(f); });

            blockers.forEach(b => {
                // Margen de 1px para evitar que rozar una figura en la esquina bloquee injustamente
                const m = 1;
                const left = b.x * cellSize + m; const right = (b.x + 1) * cellSize - m;
                const top = b.y * cellSize + m; const bottom = (b.y + 1) * cellSize - m;
                
                checkIntersect({x: left, y: top}, {x: right, y: top});
                checkIntersect({x: left, y: bottom}, {x: right, y: bottom});
                checkIntersect({x: left, y: top}, {x: left, y: bottom});
                checkIntersect({x: right, y: top}, {x: right, y: bottom});
            });

            if (hitPoint) {
                return { clear: false, hit: hitPoint, hx: p1.x, hy: p1.y, mx: p2.x, my: p2.y };
            }
            return { clear: true, hit: null, hx: p1.x, hy: p1.y, mx: p2.x, my: p2.y };
        }

        drawAll(); updateCombatUI();
    </script>
</body>
